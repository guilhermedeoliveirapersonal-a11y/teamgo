<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Atualização do físico · TEAM GO!</title>
<meta name="theme-color" content="#F7F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F10" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../app/icones/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
/* Área de avaliação do TEAM GO! — estilo "laudo" (v25, 22/10).
   Referências: ficha de avaliação física de papel (linhas, protocolo numerado, tabela de perimetria), folha de
   bioimpedância (faixa de referência), fita métrica (régua com tracinhos) e a própria marca (letra alta da logo,
   papel e vermelho do site). Sem cartões com sombra: linhas finas, régua e números grandes. */
:root{--bg:#F7F3EF;--sf:#FDFBF9;--sf2:#EFE9E4;--ink:#111111;--ink2:#4E4A47;--ink3:#8C8481;--line:#E2DAD4;--line2:#CFC5BE;
  --red:#C8102E;--red2:#A50D26;--redt:rgba(200,16,46,.07);--ok:#1E7F4A;--okt:#E5F1E8;--warn:#875700;--warnt:#FBEFD6;--err:#B4232C;--errt:#FBE8E8;
  --veu:rgba(200,16,46,.075);--disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F0F10;--sf:#17171A;--sf2:#211F1F;--ink:#F3F0EC;--ink2:#B6AEA9;--ink3:#7F7874;--line:#2A2827;--line2:#3A3634;
  --red:#E3243F;--red2:#C81B33;--redt:rgba(227,36,63,.12);--ok:#4CC27F;--okt:rgba(76,194,127,.12);--warn:#F0B54A;--warnt:rgba(240,181,74,.12);--err:#FF6B6B;--errt:rgba(255,107,107,.12);
  --veu:rgba(227,36,63,.13);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}i,em{font-style:normal}button{cursor:pointer}
.mut{color:var(--ink2)}.small{font-size:13.5px}
.marca{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.03em;white-space:nowrap}.marca b{color:var(--red);font-weight:800}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2.5px solid var(--red);outline-offset:3px}
input:focus-visible,textarea:focus-visible{outline:0}

/* estrutura: topo com a fita, miolo que rola, ação fixa embaixo */
#fxsh{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--veu) 0,rgba(0,0,0,0) 380px),var(--bg)}
.fx2-in{max-width:600px;margin:0 auto}
.fx2-top{flex:none;padding:calc(6px + env(safe-area-inset-top)) 6px 0;background:color-mix(in srgb,var(--bg) 66%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.fx2-bar{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:2px}
.fx2-ic{width:44px;height:44px;border:0;border-radius:6px;background:transparent;display:grid;place-items:center;color:var(--ink)}.fx2-ic[hidden]{display:grid;visibility:hidden}
.fx2-tt{line-height:1.15;min-width:0}.fx2-tt>b{display:block;font-size:15px;font-weight:600}.fx2-tt .marca{font-size:13px}
.fx2-sair{height:44px;padding:0 12px;border:0;background:none;font-size:14.5px;font-weight:600;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px}
/* a fita métrica: tracinhos a cada 2%, tracinho maior em cada etapa, parte vermelha até onde o aluno está */
.fita{position:relative;margin:4px 14px 0;padding-top:12px;--p:0%;--n:5}
.fita-reg{display:block;height:15px;border-bottom:1.5px solid var(--ink2);
  background:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px calc(100% / var(--n))) left bottom/100% 13px no-repeat,
    repeating-linear-gradient(90deg,var(--ink3) 0 1px,transparent 1px 4%) left bottom/100% 8px no-repeat,
    repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 2%) left bottom/100% 5px no-repeat}
.fita-cheia{position:absolute;left:0;top:25.5px;height:3.5px;width:var(--p);background:var(--red);transition:width .4s cubic-bezier(.2,.8,.3,1)}
.fita-mk{position:absolute;top:0;left:var(--p);width:2px;height:28px;margin-left:-1px;background:var(--red);transition:left .4s cubic-bezier(.2,.8,.3,1)}
.fita-mk::before{content:"";position:absolute;top:-1px;left:-5px;border:6px solid transparent;border-top:7px solid var(--red);border-bottom:0}
.fita-et{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.fita-et span{padding:6px 0 9px 4px;font-size:11.5px;line-height:1.2;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fita-et .ok{color:var(--ink2)}.fita-et .cur{color:var(--ink);font-weight:700}
.fx2-body{flex:1;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.fx-pg{max-width:600px;margin:0 auto;padding:26px 20px 40px}
.fx2-foot{flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line2)}
.fx2-foot .fx2-in{max-width:560px}
.fx2-hint{margin:0 0 10px;font-size:13.5px;line-height:1.35;color:var(--ink2);text-align:center}.fx2-hint:empty{display:none}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:14px 18px;border:0;border-radius:8px;background:linear-gradient(180deg,#DD1F3C 0%,#B70C27 100%);color:#fff;font-size:16.5px;font-weight:600;letter-spacing:.005em;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 18px -10px rgba(200,16,46,.7)}
.bt[disabled]{background:var(--sf2);color:var(--ink3);box-shadow:none;cursor:default}
.bt.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.fx-pg.an{animation:fxIn .3s cubic-bezier(.2,.8,.3,1) both}.fx-pg.an.vt{animation-name:fxVt}
@keyframes fxIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes fxVt{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

/* texto: título na letra da marca, com o número do item do protocolo em vermelho */
h1{font-family:var(--disp);font-weight:700;font-size:42px;line-height:.98;letter-spacing:.005em;margin:0 0 12px}
h1 .fx-n{display:inline-block;margin-right:10px;color:var(--red);font-weight:600}
.fx-lead{margin:0;font-size:16px;line-height:1.55;color:var(--ink2);max-width:44ch}
.fx-q{font-weight:600;font-size:17px;line-height:1.4;margin:26px 0 10px}
.fx-q+.small{margin:-6px 0 10px}
.fx-sub{margin:-4px 0 0}
.fx-l{display:block;margin-top:20px;font-size:14px;font-weight:600}
.fx-in{display:block;width:100%;margin-top:8px;padding:12px 14px;border-radius:4px;border:1.5px solid var(--line2);background:var(--sf);font-size:16px;line-height:1.45;resize:vertical}.fx-in:focus{border-color:var(--ink)}
.fx-lista{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14.5px;line-height:1.6}
.fx-dica{margin:16px 0 0}
.fx-box{margin:22px 0 0;padding:2px 0 2px 16px;border-left:3px solid var(--red);font-size:14.5px;line-height:1.6;color:var(--ink2)}.fx-box b{color:var(--ink)}

/* início: cabeçalho de ficha (tempo, fotos, perguntas) e protocolo */
.fx-dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:24px 0 0;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line2)}
.fx-dl div{padding:10px 12px 12px;border-left:1px solid var(--line2)}.fx-dl div:first-child{border-left:0;padding-left:0}
.fx-dl dt{font-size:12.5px;color:var(--ink2)}.fx-dl dd{margin:2px 0 0;font-family:var(--disp);font-weight:700;font-size:30px;line-height:1}
.fx-prot{margin:26px 0 0}.fx-prot>b{display:block;font-size:15px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}.fx-prot>small{display:block;margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.fx-pi{display:flex;align-items:center;gap:14px;padding:11px 0;line-height:1.4;border-bottom:1px solid var(--line)}.fx-pi svg{flex:none;color:var(--ink2)}

/* respostas: linhas de ficha com quadradinho de marcar (e medidor quando a resposta é uma escala) */
.fx-ops{margin-top:4px;border-top:1.5px solid var(--ink)}
.fx-op{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 6px 12px 2px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);border-radius:0;color:var(--ink);transition:background-color .15s}
.fx-op.on{background:linear-gradient(90deg,var(--redt),rgba(0,0,0,0) 85%)}
.fx-opr{flex:none;position:relative;width:22px;height:22px;border:1.5px solid var(--ink2);border-radius:3px;background:var(--sf)}
.fx-op.on .fx-opr,.fx-sn .on .fx-opr{background:var(--red);border-color:var(--red)}
.fx-op.on .fx-opr::after,.fx-sn .on .fx-opr::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.fx-opt{flex:1;min-width:0}.fx-opt b{display:block;font-size:16px;font-weight:600;line-height:1.3}.fx-opt small{display:block;margin-top:2px;font-size:13.5px;line-height:1.4;color:var(--ink2)}
.fx-mt{flex:none;display:flex;align-items:flex-end;gap:3px;height:18px;color:var(--ink3)}
.fx-mt i{display:block;width:5px;border-radius:1px;background:var(--line2)}.fx-mt i.on{background:var(--ink2)}.fx-op.on .fx-mt i.on{background:var(--red)}
.fx-mt svg{width:22px;height:22px;color:var(--ink2)}.fx-op.on .fx-mt svg{color:var(--red)}
.fx-add{display:inline-block;margin:14px 0 0;padding:8px 0;background:none;border:0;color:var(--ink);font-weight:600;font-size:15px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px}
.fx-qb+.fx-qb{margin-top:30px}
.fx-sn{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line2)}
.fx-sn button{display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 14px 12px 2px;border:0;background:none;font-weight:600;font-size:16px;text-align:left}
.fx-sn button+button{border-left:1px solid var(--line2);padding-left:14px}.fx-sn button.on{background:var(--redt)}

/* fotos: 3 quadros com cantos de visor de câmera */
.fx-fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}.fx-fg.um{grid-template-columns:minmax(0,132px);margin-top:12px}
.fx-fi{min-width:0}
.fx-fc{position:relative;display:block;width:100%;aspect-ratio:3/4;padding:0;border:0;border-radius:2px;background:var(--sf);overflow:hidden;color:var(--ink3)}
.fx-fc::after{content:"";position:absolute;inset:6px;pointer-events:none;--k:var(--ink2);
  background:linear-gradient(var(--k),var(--k)) left top/14px 1.5px no-repeat,linear-gradient(var(--k),var(--k)) left top/1.5px 14px no-repeat,
    linear-gradient(var(--k),var(--k)) right top/14px 1.5px no-repeat,linear-gradient(var(--k),var(--k)) right top/1.5px 14px no-repeat,
    linear-gradient(var(--k),var(--k)) left bottom/14px 1.5px no-repeat,linear-gradient(var(--k),var(--k)) left bottom/1.5px 14px no-repeat,
    linear-gradient(var(--k),var(--k)) right bottom/14px 1.5px no-repeat,linear-gradient(var(--k),var(--k)) right bottom/1.5px 14px no-repeat}
.fx-fc.tem::after{--k:#fff}.fx-fc.fx-ok::after{--k:#fff}.fx-fc.fx-erro{box-shadow:inset 0 0 0 2px var(--err)}
.fx-fv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.fx-fv>img{width:100%;height:100%;object-fit:cover}.fx-fv>svg{position:relative;height:80%;width:auto}
.fx-fv .fx-gh0{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.14;filter:grayscale(1)}
.fx-ftap{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:34px;height:34px;border-radius:6px;background:var(--red);color:#fff;display:grid;place-items:center}
.fx-fmais{font-family:var(--disp);font-size:44px;font-weight:600;line-height:1;color:var(--ink3)}
.fx-fb{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;line-height:1;color:#fff;z-index:1}
.fx-fb.fx-ok{background:var(--ok)}.fx-fb.fx-aviso{background:#D9A12B;color:#2A1B00}.fx-fb.fx-erro{background:var(--err)}.fx-fb.env{background:rgba(0,0,0,.55)}
.fx-fl{display:flex;flex-direction:column;align-items:flex-start;margin-top:8px;padding-top:6px;border-top:1.5px solid var(--ink);line-height:1.3}.fx-fl b{font-size:15px;font-weight:600}.fx-fl small{font-size:12.5px;color:var(--ink2)}.fx-fl small.ok{color:var(--ok)}.fx-fl small.er{color:var(--err)}
.fx-gal{margin:2px 0 0 -2px;padding:6px 2px;background:none;border:0;color:var(--ink);font-size:13px;font-weight:600;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}.fx-gal[disabled]{opacity:.4}
.fx-qual{margin:22px 0 0;padding:4px 0 4px 16px;border-left:3px solid #D9A12B}.fx-qual p{display:flex;gap:10px;align-items:flex-start;margin:0 0 6px;font-size:14px;line-height:1.45}.fx-qual p svg{flex:none;margin-top:2px;color:var(--warn)}.fx-qual small{display:block;font-size:13px;color:var(--ink2)}
.fx-qual.ok{border-left-color:var(--ok)}.fx-qual.ok p{margin:0}.fx-qual.ok svg{color:var(--ok)}
.fx-como{margin:24px 0 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:12px 0}.fx-como summary{cursor:pointer;font-weight:600;font-size:15px}.fx-como[open] summary{margin-bottom:8px}
.fx-mapa{display:block;width:100%;max-width:260px;height:auto;margin:6px auto 4px;color:var(--ink3)}
.fx-spin{width:40px;height:40px;margin:0 auto 16px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--red);animation:fxg .9s linear infinite}@keyframes fxg{to{transform:rotate(360deg)}}
.fx-spin.sm{display:inline-block;width:14px;height:14px;margin:0;border-width:2px;border-color:rgba(255,255,255,.35);border-top-color:#fff}

/* peso: visor de balança e faixa de referência (último envio × hoje) */
.fx-kgw{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:26px 0 0;padding:12px 16px 8px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);cursor:text}
.fx-kgw:focus-within{background:var(--sf)}
.fx-kg{width:4.1ch;max-width:70%;padding:0;background:none;border:0;outline:0;font-family:var(--disp);font-weight:700;font-size:104px;line-height:1;letter-spacing:.005em;text-align:right;font-variant-numeric:tabular-nums}.fx-kg::placeholder{color:var(--line2)}
.fx-kgw span{font-family:var(--disp);font-size:34px;font-weight:600;color:var(--ink2)}
.fx-pd{margin:14px 0 0;min-height:24px}.fx-pd>span{display:block;text-align:center;font-size:14px;color:var(--ink2)}.fx-pd b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.fx-rg{position:relative;margin:4px 0 14px;padding:24px 0 0}
.fx-rgr{position:relative;height:12px;border-bottom:1.5px solid var(--ink2);background:repeating-linear-gradient(90deg,var(--ink3) 0 1px,transparent 1px 10%) left bottom/100% 8px no-repeat,repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 5%) left bottom/100% 5px no-repeat}
.fx-rgm{position:absolute;bottom:-1.5px;width:2px;margin-left:-1px;height:30px;background:var(--ink3)}.fx-rgm b{position:absolute;bottom:31px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--ink2)}
.fx-rgm.hj{background:var(--red);height:34px}.fx-rgm.hj b{color:var(--red);bottom:35px}
.fx-rgl{display:flex;justify-content:space-between;margin-top:4px;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.fx-warn{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;padding:4px 0 4px 14px;border-left:3px solid #D9A12B;font-size:14px;line-height:1.45}.fx-warn[hidden]{display:none}.fx-warn svg{flex:none;margin-top:2px;color:var(--warn)}
.fx-prot2{list-style:none;display:grid;grid-template-columns:1fr 1fr;margin:22px 0 0;padding:0;border-top:1px solid var(--line2)}.fx-prot2 li{display:flex;align-items:center;gap:10px;padding:12px 4px 12px 0;border-bottom:1px solid var(--line2);font-size:14px;line-height:1.3;color:var(--ink2)}.fx-prot2 li:nth-child(even){padding-left:12px;border-left:1px solid var(--line2)}.fx-prot2 svg{flex:none;color:var(--ink2)}

/* medidas: tabela de perimetria (1ª, 2ª, média) */
.fx-tb{margin-top:22px;border-top:1.5px solid var(--ink)}
.fx-th,.fx-tr{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 62px;gap:8px;align-items:end}
.fx-th{padding:8px 0 6px;border-bottom:1px solid var(--line2)}.fx-th small{font-size:12px;color:var(--ink2);text-align:center}
.fx-tr{padding:14px 0 12px;align-items:center}
.fx-tw{border-bottom:1px solid var(--line2)}
.fx-tn b{display:block;font-size:16px;font-weight:600}.fx-tn small{display:block;margin-top:2px;font-size:12.5px;line-height:1.35;color:var(--ink2)}.fx-tn .fx-ult{color:var(--ink3)}
.fx-tr input{width:100%;min-width:0;padding:6px 0 4px;border:0;border-bottom:1.5px solid var(--ink3);border-radius:0;background:transparent;font-family:var(--disp);font-size:26px;font-weight:600;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.fx-tr input:focus{border-bottom-color:var(--red);background:var(--sf)}
.fx-mv{display:block;text-align:center;font-family:var(--disp);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}.fx-mv.fa{color:var(--warn)}.fx-mv.fe{color:var(--err)}
.fx-mw{margin:-4px 0 12px;font-size:13px;color:var(--warn);line-height:1.4}.fx-mw:empty{display:none}.fx-mw.er{color:var(--err)}

/* nota de 0 a 10: régua; a parte até a nota fica na cor da nota */
.fx-nt{display:flex;align-items:baseline;gap:14px;margin:22px 0 10px;min-height:84px}.fx-ntv{font-family:var(--disp);font-size:96px;font-weight:700;line-height:.85;font-variant-numeric:tabular-nums}.fx-ntv.vz{color:var(--line2)}.fx-nt span{font-size:17px;font-weight:600;color:var(--ink2)}
.fx-eq{position:relative;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));border-bottom:1.5px solid var(--ink2)}
.fx-eq::after{content:"";position:absolute;left:0;bottom:-1.5px;height:4px;width:var(--w,0);background:var(--cv,var(--red));transition:width .3s ease}
.fx-eq button{position:relative;height:62px;padding:0 0 22px;border:0;background:none;font-family:var(--disp);font-size:22px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.fx-eq button::after{content:"";position:absolute;left:50%;bottom:0;width:1.5px;height:14px;margin-left:-.75px;background:var(--ink3)}
.fx-eq button.ate{color:var(--ink)}.fx-eq button.on{color:var(--c);font-weight:800;font-size:26px}
.fx-eq button.on::before{content:"";position:absolute;left:50%;top:0;margin-left:-6px;border:6px solid transparent;border-top:7px solid var(--c);border-bottom:0}
.fx-eql{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--ink3)}

/* extras */
.fx-wa{display:flex;align-items:center;gap:14px;margin-top:24px;padding:14px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);color:var(--ink);text-decoration:none}.fx-wa svg{flex:none;color:var(--ok)}.fx-wa b{display:block;font-size:15.5px;font-weight:600}.fx-wa small{display:block;font-size:13.5px;color:var(--ink2)}

/* revisão: laudo com seções numeradas */
.fx-rc{margin-top:22px}

  ok:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 12.3l2.8 2.8L16.2 9.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'};

function call(fn,args,ok,falhou){google.script.run.withSuccessHandler(function(r){if(r&&r.erro){toast(r.erro,'erro');if(falhou)falhou(r.erro);return;}if(ok)ok(r);})
  .withFailureHandler(function(er){var m=String((er&&er.message)||'');toast(m&&!/rede|resposta/.test(m)?m:'Sem conexão. Tenta de novo?','erro');if(falhou)falhou(m);})[fn].apply(null,[D.codigo].concat(args||[]));}

function iniciar(){if(qs('f')=='protocolo')return iniciarProtocolo();if(qs('f')=='anamnese')return iniciarAnamnese();var c=qs('a');
  if(!/^[A-Za-z0-9_-]{4,60}$/.test(c))return telaMsg('Abra pelo app','A atualização do físico abre pelo botão "Fazer minha atualização", no seu app TEAM GO!.');

  google.script.run.withSuccessHandler(function(r){
    if(!r||r.erro)return telaMsg('Link não encontrado','Abra a atualização pelo botão "Fazer minha atualização", no seu app TEAM GO!.');
