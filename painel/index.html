<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
<script>if(window.top!==window.self){document.documentElement.style.display='none';try{window.top.location.replace(window.location.href)}catch(e){}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel TEAM GO!</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Painel GO!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Página do painel do treinador (v19). A chave do painel chega depois do # (o navegador nunca manda essa parte
   pra internet), fica guardada no celular e sai do endereço. Tudo da página tem o prefixo tgs-. */
html{background:#111111}
#tgs-abre{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 20%,#3a0710 0,#141011 55%,#0d0d0d 100%);transition:opacity .35s ease;z-index:9000}
#tgs-abre.sai{opacity:0;pointer-events:none}
.tgs-marca{font-family:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;font-weight:900;text-align:center;line-height:.9;text-transform:uppercase;color:#F7F3EF}
.tgs-marca small{display:block;font-weight:800;font-size:22px;letter-spacing:.2em}
.tgs-marca b{display:block;font-size:80px;color:#F4001A}
.tgs-marca i{display:block;font-style:normal;font-weight:800;font-size:18px;letter-spacing:.3em;color:#B8ACA9;margin-top:8px}
.tgs-pulsa{animation:tgsPulsa 1.4s ease-in-out infinite}
@keyframes tgsPulsa{50%{opacity:.55}}
.tgs-tela{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));text-align:center;background:radial-gradient(120% 70% at 50% 10%,#2a0a0e 0,#111 60%);color:#F7F3EF;font-family:'Montserrat',Arial,sans-serif;box-sizing:border-box}
.tgs-tela h1{font-family:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;font-weight:900;font-size:30px;text-transform:uppercase;margin:0}
.tgs-tela p{margin:0;color:#B8ACA9;max-width:36ch;line-height:1.5;font-size:15px}
.tgs-caixa{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.tgs-caixa input{box-sizing:border-box;width:100%;font:inherit;font-size:16px;padding:14px;border-radius:12px;border:1px solid rgba(247,243,239,.13);background:#1B1B1B;color:#F7F3EF}
.tgs-btn{font:inherit;font-weight:700;font-size:16px;padding:14px 18px;border-radius:12px;border:0;background:linear-gradient(180deg,#FF2A3B,#C80016);color:#fff;cursor:pointer}
.tgs-btn.gh{background:transparent;border:1px solid rgba(247,243,239,.13);color:#F7F3EF}
.tgs-erro{color:#FF3B4A;font-size:14px;min-height:1em}
.tgs-caixa[hidden],.tgs-tela [hidden]{display:none}
/* v27: liberar este aparelho (código de 6 números no e-mail) */
.tgs-tela{justify-content:flex-start;overflow-y:auto}.tgs-tela>:first-child{margin-top:auto}.tgs-tela>:last-child{margin-bottom:auto}
.tgs-cod{text-align:center;font-size:26px!important;letter-spacing:.3em;font-weight:700}
.tgs-lnk{font:inherit;font-size:14.5px;background:none;border:0;color:#F7F3EF;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
.tgs-ok{color:#9be3a8;font-size:14px}
</style>
<script src="../ponte.js"></script>
<script src="../instalar.js"></script>
</head>
<body>
<div id="tgs-abre"><div class="tgs-marca tgs-pulsa"><small>Team</small><b>GO!</b><i>Painel</i></div></div>
<script>
(function () {
  var P = window.TGPonte, guarda = P.guarda, CHAVE = 'tg_painel_k', APAR = 'tg_painel_t';
  var $ = function (id) { return document.getElementById(id); };
  var sai = function () { $('tgs-abre').classList.add('sai'); };
  var MARCA = '<div class="tgs-marca"><small>Team</small><b>GO!</b><i>Painel</i></div>';
  var valida = function (k) { return /^[A-Za-z0-9_-]{8,64}$/.test(String(k || '')); };
  var doLink = function (t) {
    t = String(t || '').trim();
    var m = /[?&#]k=([A-Za-z0-9_-]{8,64})/.exec(t);
    if (m) return m[1];
    return valida(t) ? t : '';
  };

  // a chave: do #k=... (link do e-mail) ou a guardada no celular; tira do endereço na hora
  var k = doLink(location.hash);
  if (k) { guarda.por(CHAVE, k); history.replaceState(null, '', location.pathname); }
  else k = guarda.ler(CHAVE);
  if (!valida(k)) return pedirLink('Abra pelo botão "Abrir meu painel" do e-mail "Seu painel TEAM GO!", ou cole o link do painel aqui.');
  // v52: abre na hora com a última cópia (casca + dados de até 12 h), confere com o servidor por trás e avisa se chegou coisa nova.
  // O botão ↻ do painel (e o puxar pra baixo) pede dados novos sem usar a cópia. Offline também abre com a cópia.
  var CASCA = 'tg_painel_casca', DADOS = 'tg_painel_dados', MARCA_D = '/*@@TGDADOS@@*/', cg = null, cd = null, fresco = false;
  try { cg = JSON.parse(guarda.ler(CASCA) || 'null'); if (!cg || !cg.v || !cg.html || cg.html.indexOf(MARCA_D) < 0) cg = null; } catch (e) { cg = null; }
  try { fresco = sessionStorage.getItem('tg_fresco') === '1'; sessionStorage.removeItem('tg_fresco'); } catch (e) { }
  try { cd = JSON.parse(guarda.ler(DADOS) || 'null'); if (!cd || cd.k !== k || !cd.s || !cd.t || Date.now() - cd.t > 12 * 36e5 || !cg || cd.v !== cg.v) cd = null; } catch (e) { cd = null; }
  var rapido = !!(cg && cd && !fresco), montado = false;
  if (navigator.onLine === false && !(cg && cd)) return semInternet();
  P.instalarGoogle();
  // v27: com a liberação de aparelho ligada, cada chamada leva também a senha deste aparelho (chave.senha)
  var t = guarda.ler(APAR) || '';
  if (!/^[a-f0-9]{32}$/.test(t)) t = '';
  // v51: a casca do painel (visual + programa) fica guardada no celular pela versão; a cada abertura só os dados descem
  function instalador() {
    // v47: convite pra instalar o painel na tela do celular (o mesmo do app)
    if (window.TGInstalar) window.TGInstalar({ guarda: guarda, nome: 'Painel GO!', oQue: 'o painel', icone: 'icones/icone-192.png', chaves: { adia: 'tg_painel_instala_depois', ja: 'tg_painel_instala_ja', barra: 'tg_painel_instala_barra' } });
  }
  function aviso() { // chegou coisa nova enquanto o painel aberto estava com a cópia
    var d = document.createElement('div'); d.id = 'tg-novo';
    d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:90;background:#E00018;color:#fff;border-radius:999px;padding:10px 16px;font:700 13px "Montserrat",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center';
    d.innerHTML = 'Dados novos chegaram <button type="button" style="border:0;border-radius:999px;background:#fff;color:#B0001A;font:800 12px sans-serif;padding:6px 12px;cursor:pointer">Atualizar</button>';
    d.querySelector('button').onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }
  function mostrar(base, dados) {
    P.montar(base.split(MARCA_D).join(dados), $('tgs-abre')); sai(); window.TG_MODO = 'direto'; montado = true; instalador();
  }
  if (rapido) { window.TG_VELHO = cd.t; mostrar(cg.html, cd.s); }
  P.porta('cascaPainel', [t ? k + '.' + t : k, cg ? cg.v : '']).then(function (r) {
    if (typeof r.dados !== 'string') { // servidor antigo: painel inteiro de uma vez
      if (!montado) { P.montar(r.html, $('tgs-abre')); sai(); window.TG_MODO = 'direto'; montado = true; instalador(); }
      return;
    }
    if (r.html) { if (!guarda.por(CASCA, JSON.stringify({ v: r.v, html: r.html }))) guarda.tira(CASCA); }
    guarda.por(DADOS, JSON.stringify({ k: k, v: r.v, t: Date.now(), s: r.dados }));
    if (montado) { if (cd && r.dados !== cd.s && Date.now() - cd.t > 120000) aviso(); return; }
    var base = r.html || (cg && cg.html);
    if (!base) { guarda.tira(CASCA); return location.reload(); }
    mostrar(base, r.dados);
  }, function (e) {
    if (montado && !(e && e.servidor)) return; // sem sinal: continua com a cópia
    if (e && e.servidor && /Aparelho não liberado/.test(e.message)) { guarda.tira(APAR); guarda.tira(DADOS); return montado ? location.reload() : liberar(); }
    if (e && e.servidor) { guarda.tira(CHAVE); guarda.tira(DADOS); return montado ? location.reload() : pedirLink('Essa chave não abre o painel. Cole o link do painel mais recente.'); }
    // plano B: o painel no endereço do Google (jeito antigo)
    window.TG_MODO = 'google';
    location.replace(P.APP + '?p=painel&k=' + encodeURIComponent(k));
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function tela(html) {
    sai();
    var d = document.createElement('div');
    d.className = 'tgs-tela';
    d.innerHTML = html;
    document.body.appendChild(d);
    return d;
  }
  function pedirLink(txt) {
    var d = tela(MARCA + '<h1>Seu painel</h1><p>' + txt + '</p>' +
      '<form class="tgs-caixa" id="tgs-f"><input id="tgs-lk" inputmode="url" autocomplete="off" placeholder="Cole aqui o link do painel" aria-label="Link do painel">' +
      '<button class="tgs-btn" type="submit">Entrar</button><div class="tgs-erro" id="tgs-er" role="alert"></div></form>');
    d.querySelector('#tgs-f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var c = doLink(d.querySelector('#tgs-lk').value);
      if (!c) { d.querySelector('#tgs-er').textContent = 'Esse não parece ser o link do painel.'; return; }
      guarda.por(CHAVE, c);
      location.replace(location.pathname);
    });
  }
  // v27: aparelho novo. O código vai pro e-mail do Gui e vale 10 minutos; a senha do aparelho fica guardada aqui.
  function nomeAparelho() {
    var u = navigator.userAgent || '';
    var so = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac OS X|Macintosh/.test(u) ? 'Mac' : /Linux|CrOS/.test(u) ? 'Computador' : 'Aparelho';
    var nav = /Edg\//.test(u) ? 'Edge' : /OPR\//.test(u) ? 'Opera' : /SamsungBrowser/.test(u) ? 'Samsung Internet' : /CriOS|Chrome\//.test(u) ? 'Chrome' : /FxiOS|Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : '';
    var ins = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    return so + (nav ? ' · ' + nav : '') + (ins ? ' (app instalado)' : '');
  }
  function liberar() {
    var d = tela(MARCA + '<h1>Liberar este aparelho</h1><p>Por segurança, o painel só abre nos aparelhos que você liberou. Vou mandar um código de 6 números pro seu e-mail de personal.</p>' +
      '<div class="tgs-caixa"><button class="tgs-btn" type="button" id="tgs-pc">Mandar código</button>' +
      '<form class="tgs-caixa" id="tgs-cf" hidden><input id="tgs-cd" class="tgs-cod" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" aria-label="Código de 6 números">' +
      '<button class="tgs-btn" type="submit">Liberar</button><button class="tgs-lnk" type="button" id="tgs-pn">Mandar outro código</button></form>' +
      '<div class="tgs-erro" id="tgs-ce" role="status"></div></div>');
    var pc = d.querySelector('#tgs-pc'), cf = d.querySelector('#tgs-cf'), cd = d.querySelector('#tgs-cd'), ce = d.querySelector('#tgs-ce');
    var msg = function (txt, ok) { ce.textContent = txt || ''; ce.className = ok ? 'tgs-ok' : 'tgs-erro'; };
    var pedir = function (b) {
      b.disabled = true; msg('Mandando…', true);
      P.porta('painelAparelhoPedir', [k, nomeAparelho()]).then(function (r) {
        b.disabled = false;
        if (r && r.livre) return location.replace(location.pathname);
        if (!r || r.erro) return msg((r && r.erro) || 'Não deu pra mandar. Tente de novo.');
        pc.hidden = true; cf.hidden = false; cd.value = ''; cd.focus();
        msg('Mandei pro ' + r.para + '. Pode levar 1 minuto; olhe também o spam.', true);
      }, function (e) { b.disabled = false; msg((e && e.servidor && e.message) || 'Sem conexão. Tente de novo.'); });
    };
    pc.addEventListener('click', function () { pedir(pc); });
    d.querySelector('#tgs-pn').addEventListener('click', function (ev) { pedir(ev.currentTarget); });
    cf.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var c = cd.value.replace(/\D/g, ''), b = cf.querySelector('button[type=submit]');
      if (c.length !== 6) return msg('O código tem 6 números.');
      b.disabled = true; msg('Conferindo…', true);
      P.porta('painelAparelhoConfirmar', [k, c, nomeAparelho()]).then(function (r) {
        b.disabled = false;
        if (!r || r.erro || !r.t) return msg((r && r.erro) || 'Não deu certo. Tente de novo.');
        if (!guarda.por(APAR, r.t)) return msg('Este navegador não deixa guardar a liberação (aba anônima?). Abra o painel numa aba normal.');
        location.replace(location.pathname);
      }, function (e) { b.disabled = false; msg((e && e.servidor && e.message) || 'Sem conexão. Tente de novo.'); });
    });
  }
  function semInternet() {
    var d = tela(MARCA + '<h1>Sem internet</h1><p>O painel precisa de internet pra abrir. Assim que o sinal voltar, ele abre sozinho.</p>' +
      '<button class="tgs-btn gh" type="button" id="tgs-de">Tentar de novo</button>');
    d.querySelector('#tgs-de').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  }
})();
</script>
</body>
</html>
