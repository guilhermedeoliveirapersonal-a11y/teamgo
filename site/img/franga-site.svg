<!-- Mestra Franga (identidade nova, 11/11/2026): par do Mestre Galo novo. Atleta: cabeça grande, rabo de cavalo com xuxinha, olhos abertos com 2 cílios, top vermelho com o GO, tanquinho leve, quadril marcado, coxas de frango (quadríceps e gota) com punho de penas, tênis, uma asa na cintura e a outra com o halterzinho. Sem short escuro, sem muque grandão, sem cintura de vespa. Desenho original. -->
<defs>
