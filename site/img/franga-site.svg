  <feDiffuseLighting in="b" surfaceScale="5" diffuseConstant="1.22" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="52"/></feDiffuseLighting>
  <feComposite in="d" in2="SourceAlpha" operator="in" result="d2"/>
  <feBlend in="SourceGraphic" in2="d2" mode="multiply" result="m"/>
