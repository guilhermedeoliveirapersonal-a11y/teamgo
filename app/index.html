<style>
/* Página do app TEAM GO! (v19): monta o app aqui mesmo e conversa com o Google pela porta de dados.
   Tudo da página tem o prefixo tgs- pra não misturar com o visual do app. */
:root{--tgs-bg:#111111;--tgs-card:#1B1B1B;--tgs-line:rgba(247,243,239,.13);--tgs-txt:#F7F3EF;--tgs-mut:#B8ACA9;--tgs-red:#F4001A;--tgs-redt:#FF3B4A}
html{background:#111111}
/* abertura com a marca enquanto o app carrega */
#tgs-abre{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 20%,#3a0710 0,#141011 55%,#0d0d0d 100%);transition:opacity .35s ease;z-index:9000}
#tgs-abre.sai{opacity:0;pointer-events:none}
.tgs-marca{font-family:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;font-weight:900;text-align:center;line-height:.9;text-transform:uppercase;color:#F7F3EF}
.tgs-marca small{display:block;font-weight:800;font-size:28px;letter-spacing:.2em}
.tgs-marca b{display:block;font-size:96px;color:var(--tgs-red)}
.tgs-pulsa{animation:tgsPulsa 1.4s ease-in-out infinite}
@keyframes tgsPulsa{50%{opacity:.55}}
/* telas próprias (sem link, sem internet, link não encontrado) */
.tgs-tela{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));text-align:center;background:radial-gradient(120% 70% at 50% 10%,#2a0a0e 0,#111 60%);color:#F7F3EF;font-family:'Libre Franklin',Arial,sans-serif;box-sizing:border-box}
.tgs-tela h1{font-family:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;font-weight:900;font-size:30px;text-transform:uppercase;margin:0;letter-spacing:.02em}
.tgs-tela p{margin:0;color:var(--tgs-mut);max-width:34ch;line-height:1.5;font-size:15px}
.tgs-caixa{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.tgs-caixa input{box-sizing:border-box;width:100%;font:inherit;font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--tgs-line);background:var(--tgs-card);color:#F7F3EF}
.tgs-caixa input:focus{outline:2px solid var(--tgs-redt);outline-offset:1px}
.tgs-btn{font:inherit;font-weight:700;font-size:16px;padding:14px 18px;border-radius:12px;border:0;background:linear-gradient(180deg,#FF2A3B,#C80016);color:#fff;cursor:pointer}
.tgs-btn.gh{background:transparent;border:1px solid var(--tgs-line);color:#F7F3EF}
.tgs-erro{color:var(--tgs-redt);font-size:14px;min-height:1em}
/* v25: "perdi meu link" (o link vai pro e-mail da planilha); tela rola se não couber, sem cortar o topo */
.tgs-tela{justify-content:flex-start;overflow-y:auto}.tgs-tela>:first-child{margin-top:auto}.tgs-tela>:last-child{margin-bottom:auto}
.tgs-lnk{font:inherit;font-size:14.5px;background:none;border:0;color:#F7F3EF;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
.tgs-ok{color:#9be3a8}
.tgs-caixa[hidden],.tgs-tela [hidden]{display:none}
/* v27: "Sair deste celular" */
.tgs-tela a.tgs-btn{display:block;text-decoration:none;box-sizing:border-box}
/* plano B: o app do Google dentro de um quadro (jeito da v17) */
html.tgs-q,html.tgs-q body{margin:0;height:100%;background:#111111;overflow:hidden}
#tgs-quadro{position:fixed;inset:0;bottom:var(--tgs-barra,0px);width:100%;height:calc(100% - var(--tgs-barra,0px));border:0;display:block;background:#111111}
/* convite pra instalar (só no navegador, nunca no app instalado) */
#tgs-instala{display:none;position:fixed;left:0;right:0;bottom:0;z-index:8500;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:#1B1B1B;border-top:1px solid var(--tgs-line);font-family:'Libre Franklin',Arial,sans-serif;box-sizing:border-box}
#tgs-instala.on{display:flex}
#tgs-instala img{width:40px;height:40px;border-radius:10px;flex:none}
#tgs-instala .tgs-tx{flex:1;min-width:0;font-size:13.5px;line-height:1.35;color:var(--tgs-mut)}
#tgs-instala .tgs-tx b{color:#F7F3EF;display:block;font-size:14.5px}
#tgs-instala .tgs-btn{padding:10px 14px;font-size:14px;flex:none}
#tgs-instala .tgs-x{background:none;border:0;color:var(--tgs-mut);font-size:22px;line-height:1;padding:6px;cursor:pointer;flex:none}
.tgs-comp{display:inline-block;width:14px;height:16px;vertical-align:-3px}
/* com o convite aberto, a barra de abas do app sobe pra ficar acima dele */
html.tgs-convite:not(.tgs-q) .tabs{bottom:calc(var(--tgs-barra,0px) + 10px)}
html.tgs-convite:not(.tgs-q) body{padding-bottom:var(--tgs-barra,0px)}
/* v45 (03/11): convite grande pra instalar, logo ao abrir, com o passo a passo certo pra cada celular */
#tgs-folha{position:fixed;inset:0;z-index:9500;display:none;align-items:flex-end;justify-content:center;font-family:'Libre Franklin',Arial,sans-serif;color:#F7F3EF}
#tgs-folha.on{display:flex}
#tgs-folha .tgs-fundo{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;transition:opacity .3s ease;backdrop-filter:blur(3px)}
#tgs-folha.vis .tgs-fundo{opacity:1}
#tgs-folha .tgs-cx{position:relative;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-sizing:border-box;padding:12px 22px calc(22px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:radial-gradient(120% 60% at 50% 0,#3a0710 0,#1B1B1B 60%);border:1px solid var(--tgs-line);border-bottom:0;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.8,.2,1);text-align:center}
#tgs-folha.vis .tgs-cx{transform:none}
.tgs-pega{width:44px;height:5px;border-radius:9px;background:rgba(247,243,239,.25);margin:0 auto 14px}
.tgs-ic{width:76px;height:76px;border-radius:20px;display:block;margin:4px auto 12px;box-shadow:0 10px 30px -6px rgba(244,0,26,.6);animation:tgsFlut 2.6s ease-in-out infinite}
@keyframes tgsFlut{50%{transform:translateY(-5px)}}
#tgs-folha h2{font-family:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;font-weight:900;font-size:28px;line-height:1;text-transform:uppercase;margin:0 0 8px}
#tgs-folha .tgs-sub{margin:0 auto 16px;color:var(--tgs-mut);font-size:15px;line-height:1.45;max-width:34ch}
.tgs-passos{list-style:none;margin:0 0 16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px;counter-reset:p}
.tgs-passos li{counter-increment:p;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--tgs-line);font-size:15px;line-height:1.4}
.tgs-passos li::before{content:counter(p);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#E00018;color:#fff;font-weight:700;font-size:14px}
.tgs-passos svg{display:inline-block;width:20px;height:20px;vertical-align:-4px;margin:0 2px}
.tgs-passos b{color:#fff}
#tgs-folha .tgs-btn{width:100%;font-size:17px;padding:16px;margin-top:2px;box-shadow:0 10px 26px -10px rgba(224,0,24,.9);transition:transform .12s ease}
#tgs-folha .tgs-btn:active{transform:scale(.97)}
#tgs-folha .tgs-btn.gh{box-shadow:none}
.tgs-pulso{animation:tgsPulsoB 1.8s ease-in-out infinite}
@keyframes tgsPulsoB{50%{box-shadow:0 0 0 8px rgba(224,0,24,.18),0 10px 26px -10px rgba(224,0,24,.9)}}
.tgs-linha{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.tgs-linha button{font:inherit;font-size:14.5px;background:none;border:0;color:var(--tgs-mut);padding:10px 12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tgs-aviso{font-size:13px;color:var(--tgs-mut);margin:10px 0 0}
.tgs-seta{position:fixed;z-index:9600;width:46px;height:46px;pointer-events:none;display:none;animation:tgsSeta 1.1s ease-in-out infinite}
.tgs-seta.on{display:block}
.tgs-seta svg{width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.tgs-dica{position:fixed;z-index:9600;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));display:none;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#E00018;color:#fff;font:600 15px/1.35 'Libre Franklin',Arial,sans-serif;box-shadow:0 12px 30px -8px rgba(0,0,0,.7)}
.tgs-dica.topo{bottom:auto;top:64px}
.tgs-dica.on{display:flex;animation:tgsDica .4s cubic-bezier(.2,.8,.2,1)}
.tgs-dica span{flex:1}.tgs-dica button{background:none;border:0;color:#fff;font-size:24px;line-height:1;padding:4px 6px;cursor:pointer}
@keyframes tgsDica{from{opacity:0;transform:translateY(12px)}}
#tgs-folha a.tgs-btn{display:block;text-decoration:none;box-sizing:border-box;margin-bottom:6px}
#tgs-folha .tgs-cx svg{display:inline-block;width:20px;height:20px;vertical-align:-4px;margin:0 2px}
.tgs-passos small{display:block;color:var(--tgs-mut);font-size:13px;margin-top:2px}
#tgs-folha .tgs-btn.gh{margin-top:4px}
html.tgs-folhaon .tabs{visibility:hidden}
@keyframes tgsSeta{50%{translate:0 10px}}
.tgs-seta.cima{animation-name:tgsSetaC}@keyframes tgsSetaC{50%{translate:0 -10px}}
@media (prefers-reduced-motion:reduce){.tgs-ic,.tgs-pulso,.tgs-seta{animation:none}#tgs-folha .tgs-cx,#tgs-folha .tgs-fundo{transition:none}}
</style>
<script src="../ponte.js"></script>
<script src="../instalar.js"></script>
</head>
<body>
<div id="tgs-abre"><div class="tgs-marca tgs-pulsa"><small>Team</small><b>GO!</b></div></div>
<div id="tgs-instala" role="region" aria-label="Instalar o app">
  <img src="icones/icone-192.png" alt="">
  <div class="tgs-tx" id="tgs-instalaTx"><b>Instale o app TEAM GO!</b>Fica na tela do celular e abre em tela cheia.</div>
  <button class="tgs-btn" id="tgs-instalaBtn" type="button">Instalar</button>
  <button class="tgs-x" id="tgs-instalaX" type="button" aria-label="Agora não">×</button>
</div>
<script>
(function () {
  var P = window.TGPonte, guarda = P.guarda;
  var CHAVE = 'tg_codigo', ADIA = 'tg_instala_depois', CASCA = 'tg_casca';
  var $ = function (id) { return document.getElementById(id); };
  var t0 = Date.now(), tocou = false;
  window.addEventListener('pointerdown', function () { tocou = true; }, { once: true, capture: true });
  var valido = function (c) { return /^[A-Za-z0-9_-]{4,60}$/.test(String(c || '')); };
  var doLink = function (t) {
    t = String(t || '').trim();
    var m = /[?&#]a=([A-Za-z0-9_-]{4,60})/.exec(t);
    if (m) return m[1];
    return valido(t) ? t : '';
  };
  var instalado = function () {
    return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  };
  var sai = function () { $('tgs-abre').classList.add('sai'); };
  // (antes de tudo: as telas abaixo usam estes pedaços logo no começo)
  var MARCA = '<div class="tgs-marca"><small>Team</small><b>GO!</b></div>';
  var FORM = '<form class="tgs-caixa" id="tgs-f"><input id="tgs-lk" inputmode="url" autocomplete="off" placeholder="Cole aqui o seu link" aria-label="Seu link do app">' +
    '<button class="tgs-btn" type="submit">Entrar</button><div class="tgs-erro" id="tgs-er" role="alert"></div></form>';
  var PERDI = '<button class="tgs-lnk" type="button" id="tgs-pl">Perdi meu link</button><form class="tgs-caixa" id="tgs-pf" hidden><p style="margin:0 auto">Digite o seu e-mail. Se for de um aluno do time, o link chega nele em alguns minutos.</p>' +
    '<input id="tgs-em" type="email" inputmode="email" autocomplete="email" placeholder="Seu e-mail" aria-label="Seu e-mail"><button class="tgs-btn gh" type="submit">Mandar o link pro meu e-mail</button><div class="tgs-erro" id="tgs-pm" role="status"></div></form>';

  // 1) qual aluno: o código vem no link pessoal (?a=...) e fica guardado no celular
  var url = new URL(location.href), codigo = url.searchParams.get('a');
  // v27: "Sair deste celular" (link no card "Seu plano"): apaga tudo do TEAM GO! guardado neste aparelho
  if (url.searchParams.get('sair') === '1') return sair();
  // v21: "Ver app" do painel (o Gui olhando): não conta como acesso do aluno e não guarda o código neste celular
  window.TG_OLHAR = url.searchParams.get('olhar') === '1';
  if (valido(codigo)) { if (!window.TG_OLHAR) guarda.por(CHAVE, codigo); }
  else {
    codigo = guarda.ler(CHAVE);
    // deixa o código no endereço, pra que "Adicionar à tela inicial" já leve o aluno certo
    if (valido(codigo)) { url.searchParams.set('a', codigo); history.replaceState(null, '', url.pathname + url.search + url.hash); }
  }
  if (!valido(codigo)) return semLink();
  if (navigator.onLine === false && !cascaGuardada()) return semInternet();
  abrirApp();
  if (!window.TG_OLHAR) convite();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function cascaGuardada() {
    try { var c = JSON.parse(guarda.ler(CASCA) || 'null'); return c && c.cod === codigo && c.html ? c : null; } catch (e) { return null; }
  }
  function guardarCasca(r) {
    if (!r || !r.html) return;
    if (!guarda.por(CASCA, JSON.stringify({ v: r.v, cod: codigo, html: r.html }))) guarda.tira(CASCA);
  }

  // 2) o app: monta aqui mesmo (rápido, sem o bloqueio do Google). Uma conversa só ("abrir") traz as telas
  //    (ou "igual", se a cópia guardada ainda vale) e os dados do aluno. Sem a porta nova, usa o quadro (plano B).
  function abrirApp() {
    P.instalarGoogle();
    var c = cascaGuardada();
    var conversa = P.porta('abrir', [codigo, c ? c.v : '', { inst: instalado() }]).catch(function (e) {
      // Google sem o "abrir" (versão anterior no ar): telas e dados em duas conversas, como na v19
      if (e && e.servidor && /inválida/.test(e.message)) return P.porta('casca', [codigo, c ? c.v : '']).then(function (cas) { return { casca: cas, velho: true }; });
      throw e;
    });
    // os dados que chegam junto respondem a primeira pergunta do app (alunoDados), sem ir de novo ao Google
    var dados = conversa.then(function (r) {
      if (r.velho) return P.porta('alunoDados', [codigo]);
      if (r.dados && r.dados.erro) { var er = new Error(r.dados.erro); er.servidor = true; throw er; }
      return r.dados ? r.dados.r : null;
    });
    dados.catch(function () {});
    P.preCarregar('alunoDados', dados);
    if (c) {
      // abre na hora com as telas guardadas; se saiu versão nova, guarda e (no comecinho) já recarrega
      P.montar(c.html, $('tgs-abre')); sai(); window.TG_MODO = 'direto';
      conversa.then(function (r) {
        var cas = r && r.casca;
        if (cas && !cas.igual && cas.html) {
          guardarCasca(cas);
          if (Date.now() - t0 < 6000 && !tocou) location.reload();
        }
      }, function () {});
      return;
    }
    conversa.then(function (r) {
      guardarCasca(r.casca);
      P.montar(r.casca.html, $('tgs-abre')); sai(); window.TG_MODO = 'direto';
    }, function (e) {
      if (e && e.servidor) return naoAchou(e.message);
      quadro();
    });
  }
  function quadro() {
    window.TG_MODO = 'quadro';
    document.documentElement.classList.add('tgs-q');
    var f = document.createElement('iframe');
    f.id = 'tgs-quadro';
    f.title = 'TEAM GO!';
    f.allow = 'clipboard-read; clipboard-write; fullscreen; camera';
    f.src = P.APP + '?a=' + encodeURIComponent(codigo);
    f.addEventListener('load', sai);
    setTimeout(sai, 6000); // se o Google demorar, tira a abertura mesmo assim
    document.body.insertBefore(f, $('tgs-abre'));
  }
  function tela(html) {
    sai();
    var d = document.createElement('div');
    d.className = 'tgs-tela';
    d.innerHTML = html;
    document.body.appendChild(d);
    return d;
  }
  function caixaLink(d) {
    d.querySelector('#tgs-f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var c = doLink(d.querySelector('#tgs-lk').value);
      if (!c) { d.querySelector('#tgs-er').textContent = 'Esse não parece ser o seu link. Confere a mensagem do Gui.'; return; }
      guarda.por(CHAVE, c);
      location.replace(location.pathname + '?a=' + encodeURIComponent(c));
    });
  }
  // v25: perdeu o link? o servidor manda pro e-mail que está na planilha (quem digitou não vê o link)
  function perdi(d) {
    var f = d.querySelector('#tgs-pf'), b = d.querySelector('#tgs-pl'); if (!f || !b) return;
    b.addEventListener('click', function () { f.hidden = false; b.hidden = true; d.querySelector('#tgs-em').focus(); });
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var em = d.querySelector('#tgs-em').value.trim(), m = d.querySelector('#tgs-pm'), bt = f.querySelector('button');
      m.className = 'tgs-erro';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { m.textContent = 'Confira o e-mail.'; return; }
      bt.disabled = true; m.textContent = 'Enviando…';
      P.porta('appRecuperar', [em]).then(function (r) {
        if (r && r.erro) { bt.disabled = false; m.textContent = r.erro; return; }
        m.className = 'tgs-erro tgs-ok'; m.textContent = (r && r.msg) || 'Pronto! Confira o seu e-mail.';
        setTimeout(function () { bt.disabled = false; }, 20000);
      }).catch(function (e) { bt.disabled = false; m.textContent = (e && e.servidor && e.message) || 'Sem conexão. Tente de novo.'; });
    });
  }
  function sair() {
    var d = tela(MARCA + '<h1>Sair deste celular?</h1><p>O app esquece o seu link e tudo o que guardou neste aparelho. Seus pontos, moedas, fotos e avaliações continuam guardados com o Gui.</p>' +
      '<p>Pra entrar de novo é só abrir o seu link (ou pedir em "Perdi meu link").</p>' +
      '<div class="tgs-caixa"><button class="tgs-btn" type="button" id="tgs-sim">Sim, sair</button><button class="tgs-btn gh" type="button" id="tgs-nao">Voltar pro app</button></div>');
    d.querySelector('#tgs-nao').addEventListener('click', function () { location.replace(location.pathname); });
    d.querySelector('#tgs-sim').addEventListener('click', function () {
      try { var tira = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^tg_/.test(k)) tira.push(k); } tira.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}
      try { if (window.caches) caches.keys().then(function (l) { l.forEach(function (n) { if (/^tg-/.test(n)) caches.delete(n); }); }); } catch (e) {}
      history.replaceState(null, '', location.pathname);
      d.remove();
      tela(MARCA + '<h1>Pronto</h1><p>Este celular não guarda mais nada do seu app.</p><p>Se o ícone do TEAM GO! estiver na tela inicial, pode tirar ele também: segure o ícone e escolha remover.</p>' +
        '<div class="tgs-caixa"><a class="tgs-btn gh" href="../aluno/">Ir pra Área do aluno</a></div>');
    });
  }
  function semLink() {
    var d = tela(MARCA + '<h1>Bem-vindo ao seu app</h1><p>Abra pelo link que o Gui te mandou no WhatsApp. Se preferir, cole o link aqui embaixo.</p>' + FORM + PERDI);
    caixaLink(d); perdi(d);
  }
  function naoAchou() {
    guarda.tira(CHAVE); guarda.tira(CASCA);
