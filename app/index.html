<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEAM GO!</title>
<meta name="description" content="Seu app do TEAM GO!: treino, sequência, medalhas e o time.">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TEAM GO!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
<link rel="apple-touch-icon" href="icones/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Libre+Franklin:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Página do app TEAM GO! (v19): monta o app aqui mesmo e conversa com o Google pela porta de dados.
   Tudo da página tem o prefixo tgs- pra não misturar com o visual do app. */
:root{--tgs-bg:#111111;--tgs-card:#1B1B1B;--tgs-line:rgba(247,243,239,.13);--tgs-txt:#F7F3EF;--tgs-mut:#B8ACA9;--tgs-red:#F4001A;--tgs-redt:#FF3B4A}
html{background:#111111}
/* abertura com a marca enquanto o app carrega */
#tgs-abre{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 70% at 50% 20%,#3a0710 0,#141011 55%,#0d0d0d 100%);transition:opacity .35s ease;z-index:9000}
#tgs-abre.sai{opacity:0;pointer-events:none}
.tgs-marca{font-family:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;font-weight:900;text-align:center;line-height:.9;text-transform:uppercase;color:#F7F3EF}
.tgs-marca small{display:block;font-weight:800;font-size:28px;letter-spacing:.2em}
.tgs-marca b{display:block;font-size:96px;color:var(--tgs-red)}
.tgs-pulsa{animation:tgsPulsa 1.4s ease-in-out infinite}
@keyframes tgsPulsa{50%{opacity:.55}}
/* telas próprias (sem link, sem internet, link não encontrado) */
.tgs-tela{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));text-align:center;background:radial-gradient(120% 70% at 50% 10%,#2a0a0e 0,#111 60%);color:#F7F3EF;font-family:'Libre Franklin',Arial,sans-serif;box-sizing:border-box}
.tgs-tela h1{font-family:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;font-weight:900;font-size:30px;text-transform:uppercase;margin:0;letter-spacing:.02em}
.tgs-tela p{margin:0;color:var(--tgs-mut);max-width:34ch;line-height:1.5;font-size:15px}
.tgs-caixa{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.tgs-caixa input{box-sizing:border-box;width:100%;font:inherit;font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--tgs-line);background:var(--tgs-card);color:#F7F3EF}
.tgs-caixa input:focus{outline:2px solid var(--tgs-redt);outline-offset:1px}
.tgs-btn{font:inherit;font-weight:700;font-size:16px;padding:14px 18px;border-radius:12px;border:0;background:linear-gradient(180deg,#FF2A3B,#C80016);color:#fff;cursor:pointer}
.tgs-btn.gh{background:transparent;border:1px solid var(--tgs-line);color:#F7F3EF}
.tgs-erro{color:var(--tgs-redt);font-size:14px;min-height:1em}
/* plano B: o app do Google dentro de um quadro (jeito da v17) */
html.tgs-q,html.tgs-q body{margin:0;height:100%;background:#111111;overflow:hidden}
#tgs-quadro{position:fixed;inset:0;bottom:var(--tgs-barra,0px);width:100%;height:calc(100% - var(--tgs-barra,0px));border:0;display:block;background:#111111}
/* convite pra instalar (só no navegador, nunca no app instalado) */
#tgs-instala{display:none;position:fixed;left:0;right:0;bottom:0;z-index:8500;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:#1B1B1B;border-top:1px solid var(--tgs-line);font-family:'Libre Franklin',Arial,sans-serif;box-sizing:border-box}
#tgs-instala.on{display:flex}
#tgs-instala img{width:40px;height:40px;border-radius:10px;flex:none}
#tgs-instala .tgs-tx{flex:1;min-width:0;font-size:13.5px;line-height:1.35;color:var(--tgs-mut)}
#tgs-instala .tgs-tx b{color:#F7F3EF;display:block;font-size:14.5px}
#tgs-instala .tgs-btn{padding:10px 14px;font-size:14px;flex:none}
#tgs-instala .tgs-x{background:none;border:0;color:var(--tgs-mut);font-size:22px;line-height:1;padding:6px;cursor:pointer;flex:none}
.tgs-comp{display:inline-block;width:14px;height:16px;vertical-align:-3px}
/* com o convite aberto, a barra de abas do app sobe pra ficar acima dele */
html.tgs-convite:not(.tgs-q) .tabs{bottom:calc(var(--tgs-barra,0px) + 10px)}
html.tgs-convite:not(.tgs-q) body{padding-bottom:var(--tgs-barra,0px)}
</style>
<script src="../ponte.js"></script>
</head>
<body>
<div id="tgs-abre"><div class="tgs-marca tgs-pulsa"><small>Team</small><b>GO!</b></div></div>
<div id="tgs-instala" role="region" aria-label="Instalar o app">
  <img src="icones/icone-192.png" alt="">
  <div class="tgs-tx" id="tgs-instalaTx"><b>Instale o app TEAM GO!</b>Fica na tela do celular e abre em tela cheia.</div>
  <button class="tgs-btn" id="tgs-instalaBtn" type="button">Instalar</button>
  <button class="tgs-x" id="tgs-instalaX" type="button" aria-label="Agora não">×</button>
</div>
<script>
(function () {
  var P = window.TGPonte, guarda = P.guarda;
  var CHAVE = 'tg_codigo', ADIA = 'tg_instala_depois', CASCA = 'tg_casca';
  var $ = function (id) { return document.getElementById(id); };
  var t0 = Date.now(), tocou = false;
  window.addEventListener('pointerdown', function () { tocou = true; }, { once: true, capture: true });
  var valido = function (c) { return /^[A-Za-z0-9_-]{4,60}$/.test(String(c || '')); };
  var doLink = function (t) {
    t = String(t || '').trim();
    var m = /[?&#]a=([A-Za-z0-9_-]{4,60})/.exec(t);
    if (m) return m[1];
    return valido(t) ? t : '';
  };
  var instalado = function () {
    return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  };
  var sai = function () { $('tgs-abre').classList.add('sai'); };
  // (antes de tudo: as telas abaixo usam estes pedaços logo no começo)
  var MARCA = '<div class="tgs-marca"><small>Team</small><b>GO!</b></div>';
  var FORM = '<form class="tgs-caixa" id="tgs-f"><input id="tgs-lk" inputmode="url" autocomplete="off" placeholder="Cole aqui o seu link" aria-label="Seu link do app">' +
    '<button class="tgs-btn" type="submit">Entrar</button><div class="tgs-erro" id="tgs-er" role="alert"></div></form>';

  // 1) qual aluno: o código vem no link pessoal (?a=...) e fica guardado no celular
  var url = new URL(location.href), codigo = url.searchParams.get('a');
  if (valido(codigo)) guarda.por(CHAVE, codigo);
  else {
    codigo = guarda.ler(CHAVE);
    // deixa o código no endereço, pra que "Adicionar à tela inicial" já leve o aluno certo
    if (valido(codigo)) { url.searchParams.set('a', codigo); history.replaceState(null, '', url.pathname + url.search + url.hash); }
  }
  if (!valido(codigo)) return semLink();
  if (navigator.onLine === false && !cascaGuardada()) return semInternet();
  abrirApp();
  convite();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function cascaGuardada() {
    try { var c = JSON.parse(guarda.ler(CASCA) || 'null'); return c && c.cod === codigo && c.html ? c : null; } catch (e) { return null; }
  }
  function guardarCasca(r) {
    if (!r || !r.html) return;
    if (!guarda.por(CASCA, JSON.stringify({ v: r.v, cod: codigo, html: r.html }))) guarda.tira(CASCA);
  }

  // 2) o app: monta aqui mesmo (rápido, sem o bloqueio do Google). Sem a porta nova, usa o quadro (plano B).
  function abrirApp() {
    P.instalarGoogle();
    var c = cascaGuardada();
    if (c) {
      // abre na hora com o código guardado; confere em segundo plano se saiu versão nova
      P.montar(c.html, $('tgs-abre')); sai(); window.TG_MODO = 'direto';
      P.porta('casca', [codigo, c.v]).then(function (r) {
        if (r && !r.igual && r.html) {
          guardarCasca(r);
          if (Date.now() - t0 < 6000 && !tocou) location.reload(); // ainda no comecinho: já abre a versão nova
        }
      }, function () {});
      return;
    }
    P.porta('casca', [codigo]).then(function (r) {
      guardarCasca(r);
      P.montar(r.html, $('tgs-abre')); sai(); window.TG_MODO = 'direto';
    }, function (e) {
      if (e && e.servidor) return naoAchou(e.message);
      quadro();
    });
  }
  function quadro() {
    window.TG_MODO = 'quadro';
    document.documentElement.classList.add('tgs-q');
    var f = document.createElement('iframe');
    f.id = 'tgs-quadro';
    f.title = 'TEAM GO!';
    f.allow = 'clipboard-read; clipboard-write; fullscreen; camera';
    f.src = P.APP + '?a=' + encodeURIComponent(codigo);
    f.addEventListener('load', sai);
    setTimeout(sai, 6000); // se o Google demorar, tira a abertura mesmo assim
    document.body.insertBefore(f, $('tgs-abre'));
  }
  function tela(html) {
    sai();
    var d = document.createElement('div');
    d.className = 'tgs-tela';
    d.innerHTML = html;
    document.body.appendChild(d);
    return d;
  }
  function caixaLink(d) {
    d.querySelector('#tgs-f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var c = doLink(d.querySelector('#tgs-lk').value);
      if (!c) { d.querySelector('#tgs-er').textContent = 'Esse não parece ser o seu link. Confere a mensagem do Gui.'; return; }
      guarda.por(CHAVE, c);
      location.replace(location.pathname + '?a=' + encodeURIComponent(c));
    });
  }
  function semLink() {
    caixaLink(tela(MARCA + '<h1>Bem-vindo ao seu app</h1><p>Abra pelo link que o Gui te mandou no WhatsApp. Se preferir, cole o link aqui embaixo.</p>' + FORM));
  }
  function naoAchou() {
    guarda.tira(CHAVE); guarda.tira(CASCA);
    caixaLink(tela(MARCA + '<h1>Link não encontrado</h1><p>Esse link não é de nenhum aluno do time. Confere a mensagem do Gui ou fala com ele no WhatsApp: (65) 99349-7692.</p>' + FORM));
  }
  function semInternet() {
    var d = tela(MARCA + '<h1>Sem internet</h1><p>O app precisa de internet pra abrir. Assim que o sinal voltar, ele abre sozinho.</p>' +
      '<button class="tgs-btn gh" type="button" id="tgs-de">Tentar de novo</button>');
    d.querySelector('#tgs-de').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  }

  // 3) convite pra instalar: só no navegador, uma vez por semana no máximo
  function convite() {
    if (instalado()) return;
    var adiado = +(guarda.ler(ADIA) || 0);
    if (adiado && Date.now() - adiado < 7 * 864e5) return;
    var barra = $('tgs-instala'), btn = $('tgs-instalaBtn'), pedido = null;
    var raiz = document.documentElement;
    var mostra = function () { barra.classList.add('on'); raiz.classList.add('tgs-convite'); raiz.style.setProperty('--tgs-barra', barra.offsetHeight + 'px'); };
    var esconde = function () { barra.classList.remove('on'); raiz.classList.remove('tgs-convite'); raiz.style.setProperty('--tgs-barra', '0px'); };
    var fecha = function () { esconde(); guarda.por(ADIA, String(Date.now())); };
    $('tgs-instalaX').addEventListener('click', fecha);
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios) {
      $('tgs-instalaTx').innerHTML = '<b>Instale o app TEAM GO!</b>Toque em <svg class="tgs-comp" viewBox="0 0 14 16" aria-label="Compartilhar"><path d="M7 1v9M3.5 4.5 7 1l3.5 3.5M2 7.5V14h10V7.5" fill="none" stroke="#F7F3EF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> e depois em “Adicionar à Tela de Início”.';
      btn.style.display = 'none';
      mostra();
      return;
    }
    window.addEventListener('beforeinstallprompt', function (ev) {
      ev.preventDefault();
      pedido = ev;
      mostra();
    });
    btn.addEventListener('click', function () {
      if (!pedido) return;
      pedido.prompt();
      pedido.userChoice.then(function (r) { if (r && r.outcome !== 'accepted') fecha(); else esconde(); pedido = null; });
    });
    window.addEventListener('appinstalled', esconde);
  }
})();
</script>
</body>
</html>
